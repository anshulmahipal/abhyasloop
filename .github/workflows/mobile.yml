# Mobile app (React Native/Expo) – build and deploy
# Only runs when changes affect the app at repo root; ignores website, supabase, docs, README.
name: Mobile (EAS / Expo)

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'website/**'
      - 'supabase/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'website/**'
      - 'supabase/**'
      - 'docs/**'
      - 'README.md'

jobs:
  build:
    name: Mobile build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Validate app (no EAS token required). Replace with EAS Build when ready:
      # - uses: expo/expo-github-action@v8
      #   with: { eas-version: latest, token: ${{ secrets.EXPO_TOKEN }}
      # - run: eas build --platform all --non-interactive --no-wait
      - name: Validate (Expo)
        run: npx expo doctor
